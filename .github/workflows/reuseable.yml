name: Reusable Deploy

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the artifact to download"
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
      - name: List files
        run: ls
      - name: Output contents
        run: echo "Deploying..."
